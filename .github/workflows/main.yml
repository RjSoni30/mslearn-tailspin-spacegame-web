name: Testing Workflow
on: workflow_dispatch

concurrency:
  group: test-pipeline
  cancel-in-progress: false

jobs:
  Job1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juice-shop sample repo
        uses: actions/checkout@v4
        with:
          repository: juice-shop/juice-shop
          path: juice-shop
          fetch-depth: 1

      - name: Install Dependencies
        working-directory: juice-shop
        run: npm install

      - name: Update start script
        working-directory: juice-shop
        run: |
          start_script=$(jq -r '.scripts.start' package.json)
          json_data=$(jq --arg value "$start_script &" '.scripts.start = $value' package.json)
          echo "$json_data" | jq '.' > package.json

          echo "New value for start script:"
          jq -r '.scripts.start' package.json

      - name: Start Application Server
        working-directory: juice-shop
        run: npm start

      - name: ZAP Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://localhost:3000/api/Challenges'
          format: openapi
          allow_issue_writing: false
