name: Test Workflow
on:
  push:
jobs:
  Job1:
    runs-on: ubuntu-latest
    steps:
      - name: "Create JSON data"
        run: |
          json_data='[{"func":"func1","slot":"slot1"},{"func":"func2","slot":"slot2"}]'
          echo "json_data=$json_data" >> $GITHUB_ENV

  Job2:
    needs: Job1
    runs-on: ubuntu-latest
    steps:
      - name: "Validate JSON data"
        run: |
          echo "${{ needs.Job1.outputs.json_data }}"
