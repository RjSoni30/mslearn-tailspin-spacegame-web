name: Test Workflow
on:
  push:
jobs:
  Job1:
    runs-on: ubuntu-latest
    outputs:
      json_data: ${{ steps.set_json_data.outputs.json_data }}
    steps:
      - name: "Create JSON data"
        id: set_json_data
        run: |
          json_data='[{"func":"func1","slot":"slot1"},{"func":"func2","slot":"slot2"}]'
          echo "json_data=$json_data" >> $GITHUB_OUTPUT

  Job2:
    needs: Job1
    runs-on: ubuntu-latest
    steps:
      - name: "Validate JSON data"
        run: |
          echo "function app"
          echo "${{ needs.Job1.outputs.json_data }}" | jq '.[] | .func'
          echo "slot name"
          echo "${{ needs.Job1.outputs.json_data }}" | jq '.[] | .slot'
